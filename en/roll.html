 const N=40;ql.innerHTML=qm.slice(0,N).map((m,i)=>`<button data-i="${i}" class="${i==qi?'on':''}"><span>${qesc(m.label)}</span><small>${qesc(m.where)}</small></button>`).join('')
  +(qm.length>N?`<div class="more">${EN?'and':'і ще'} ${qm.length-N} ${EN?'more: refine the search':': уточніть пошук'}</div>`:'');ql.hidden=false}
ql.addEventListener('mousedown',e=>e.preventDefault());
ql.addEventListener('click',e=>{const b=e.target.closest('button');if(b){qgo(+b.dataset.i);ql.hidden=true}});
function qrun(){const q=qEl.value.trim().toLowerCase();document.querySelectorAll('text.hit').forEach(t=>t.classList.remove('hit','cur'));qm=[];qi=-1;
 if(q.length>=2){qm=qfind(q);qm.forEach(m=>m.t.classList.add('hit'));if(qm.length)qgo(0,true)}qcount();qlist()}
function qgo(i,first){if(!qm.length)return;qi=(i+qm.length)%qm.length;document.querySelectorAll('text.hit.cur').forEach(t=>t.classList.remove('cur'));
 const m=qm[qi];m.t.classList.add('cur');qshow(m,first);qcount();
 ql.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i==qi));const on=ql.querySelector('button.on');if(on)on.scrollIntoView({block:'nearest'})}
qEl.addEventListener('input',qrun);
qEl.addEventListener('keydown',e=>{if(e.key=='Enter'){e.preventDefault();qgo(qi+(e.shiftKey?-1:1))}else if(e.key=='Escape'){ql.hidden=true}
 else if(e.key=='ArrowDown'&&qm.length){e.preventDefault();qgo(qi+1)}else if(e.key=='ArrowUp'&&qm.length){e.preventDefault();qgo(qi-1)}});
qEl.addEventListener('focus',()=>{if(qm.length>1)qlist()});qEl.addEventListener('blur',()=>setTimeout(()=>{ql.hidden=true},150));
qp.onclick=()=>qgo(qi-1);qx.onclick=()=>qgo(qi+1);
addEventListener('resize',()=>{if(!ql.hidden)qlist()});
function qcenter(el){const r=el.getBoundingClientRect(),w=wrap.getBoundingClientRect();tx+=w.left+w.width/2-(r.left+r.width/2);ty+=w.top+w.height/2-(r.top+r.height/2);apply()}

const stn=[...document.querySelectorAll('nav button')].map(b=>[+b.dataset.x,b.textContent]).sort((a,b)=>a[0]-b[0]);
function near(x){let s=stn.length?stn[0][1]:'';for(const [sx,n] of stn){if(sx<=x+1)s=n;else break}return s}
function qfind(q){const out=[];svg.querySelectorAll('text').forEach(t=>{const v=vis(t);if(!v.toLowerCase().includes(q))return;let x=0;
 try{const b=t.getBBox(),c=t.ownerSVGElement;x=b.x+b.width/2;if(c&&c!==svg)x+=(+c.getAttribute('x')||0)-(c.viewBox.baseVal?c.viewBox.baseVal.x:0)}catch(e){}
 out.push({t,label:v,where:near(x),x})});return out.sort((a,b)=>a.x-b.x)}
function qshow(m){qcenter(m.t)}
</script></body></html>
