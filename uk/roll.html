">25</text></g><text class="note" x="200" y="559">обмеження швидкості, mph (на кривих і станціях, як у грі)</text><g class="ic w"><circle cx="105" cy="584" r="10"/><text x="105" y="588.5">W</text></g><g class="ic d"><circle cx="135" cy="584" r="10"/><text x="135" y="588.5">D</text></g><g class="ic c"><circle cx="165" cy="584" r="10"/><text x="165" y="588.5">C</text></g><text class="note" x="200" y="591">вода · дизель · вугілля</text><circle class="tt" cx="135" cy="616" r="16"/><text class="note" x="200" y="623">поворотне коло</text><path class="br" d="M95,641 L175,641 M95,655 L175,655 M95,655 L105,641 L115,655 L125,641 L135,655 L145,641 L155,655 L165,641 L175,655 M95,641 L95,655 M175,641 L175,655"/><text class="note" x="200" y="655">міст</text><path class="trk" d="M90,680 L180,680"/><path class="tnm" d="M101,680 L169,680"/><path class="tn" d="M102,671 Q90,680 102,689 M168,671 Q180,680 168,689"/><text class="note" x="200" y="687">тунель</text><text class="grade" x="90" y="722" style="font-size:26px">← 4.6% TOPTON</text><text class="note" x="320" y="719">найбільший ухил перегону (300 м); стрілка показує бік підйому</text><text class="note" x="90" y="754" style="font-size:16px">«R1 – 21 ВАГ.»: назва колії з гри і місткість; «16 ВАГ. – 738′»: колія без назви, вагонів і довжина.</text><text class="note" x="90" y="776" style="font-size:16px">Колії підприємств: зона завантаження (trackSpan) і вагони, що туди ходять (цистерна ~35′, хопер ~33′, критий ~41′, шахти 50′),</text><text class="note" x="90" y="798" style="font-size:16px">інакше 45′ (як у Dewclaw v3.0); округлено вниз. Колії без назви й обгінні: корисна довжина між точками розходження біля стрілок.</text><text class="note" x="90" y="820" style="font-size:16px">MP: милі від Sylva Interchange (= MP 45) уздовж головної колії.</text><text class="note" x="90" y="842" style="font-size:16px">Масштаб не дотримано: колії випрямлено, порядок колій і сторона (північ угорі) як у грі. Захід ліворуч.</text><text class="note" x="90" y="864" style="font-size:16px">Перевірено: усі 1901 сегмент колій Map.json належать коліям, намальованим на сторінках.</text><text class="note" x="90" y="886" style="font-size:16px">Сигнали CTC: розташування знято з гри через мод Map Plus (QbanRambo). Переїздів на схемі поки немає.</text><text class="note" x="90" y="908" style="font-size:16px">Швидкості: обмеження, задані в грі (без позначки = 45 mph). Реальну межу ще обмежує клас колії, що росте з ремонтом (MoW):</text><text class="note" x="90" y="930" style="font-size:16px">клас 1 – 10, 2 – 25, 3 – 40, 4 – 60, 5 – 80 mph; на початку гри майже всі колії класу 3, тобто не швидше 40 mph.</text><text class="note" x="90" y="952" style="font-size:16px">Ідея і стиль: станційна схема Dewclaw (Railroader Map v3.0), дякуємо! Колії тут намальовано заново з даних гри 0.6.2.</text></svg></div><script>document.documentElement.style.setProperty("--hh",document.querySelector("header").offsetHeight+"px");

document.getElementById('zi').onclick=()=>{z=Math.min(3,z*1.25);apply()};document.getElementById('zo').onclick=()=>{z=Math.max(0.15,z/1.25);apply()};
document.getElementById('zf').onclick=fit;
document.getElementById('bar').addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect();tx=-((e.clientX-r.left)/r.width)*W*z+wrap.clientWidth/2;apply()});
document.getElementById('q').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();
 svg.querySelectorAll('text.hit').forEach(t=>t.classList.remove('hit'));if(q.length<2)return;
 for(const t of svg.querySelectorAll('text')){if(t.textContent.toLowerCase().includes(q)){t.classList.add('hit');}}
 const f=svg.querySelector('text.hit');if(f){const r=f.getBoundingClientRect(),w=wrap.getBoundingClientRect();tx+=w.left+w.width/2-r.left;apply()}});
const leg=document.getElementById('leg'),lb=document.getElementById('lb');
function legToggle(v){const on=v===undefined?leg.hidden:v;leg.hidden=!on;lb.classList.toggle('on',on)}
const dkb=document.getElementById('dk');function setDk(v){document.body.classList.toggle('dk',v);dkb.classList.toggle('on',v);try{localStorage.setItem('rrmap-dark',v?'1':'0')}catch(e){}}
dkb.onclick=()=>setDk(!document.body.classList.contains('dk'));
{let v=new URLSearchParams(location.search).get('theme');let s=null;try{s=localStorage.getItem('rrmap-dark')}catch(e){}setDk(v?v=='dark':s=='1')}
const bdb=document.getElementById('bd');function setBd(v){document.body.classList.toggle('nob',!v);bdb.classList.toggle('on',v);try{localStorage.setItem('rrmap-bld',v?'1':'0')}catch(e){}}
bdb.onclick=()=>setBd(document.body.classList.contains('nob'));
{let s=null;try{s=localStorage.getItem('rrmap-bld')}catch(e){}setBd(s!='0')}
const sgb=document.getElementById('sg');function setSg(v){document.body.classList.toggle('nosig',!v);sgb.classList.toggle('on',v);try{localStorage.setItem('rrmap-sig',v?'1':'0')}catch(e){}}
sgb.onclick=()=>setSg(document.body.classList.contains('nosig'));
{let s=null;try{s=localStorage.getItem('rrmap-sig')}catch(e){}setSg(s!='0')}
lb.onclick=()=>legToggle();addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.key=='l'||e.key=='L'||e.key=='д'||e.key=='Д')legToggle();if(e.key=='Escape')legToggle(false)});
fit();
</script></body></html>
