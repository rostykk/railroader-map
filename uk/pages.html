const pgs=[...document.querySelectorAll('.pg')],btn=[...document.querySelectorAll('nav button')],wrap=document.getElementById('wrap');
let cur=0,z=1,tx=0,ty=0,drag=null;
function svg(){return pgs[cur].querySelector('svg')}
function apply(){svg().style.transform=`translate(${tx}px,${ty}px) scale(${z})`}
function reset(){z=1;tx=0;ty=0;pgs.forEach(p=>p.querySelector('svg').style.transform='')}
function show(i){cur=i;pgs.forEach((p,k)=>p.style.display=k==i?'block':'none');btn.forEach((b,k)=>b.classList.toggle('on',k==i));reset();history.replaceState(null,'','#'+i)}
btn.forEach((b,k)=>b.onclick=()=>show(k));
wrap.addEventListener('wheel',e=>{e.preventDefault();const r=wrap.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
 const nz=Math.min(10,Math.max(1,z*(e.deltaY<0?1.25:0.8)));tx=mx-(mx-tx)*nz/z;ty=my-(my-ty)*nz/z;z=nz;if(z==1){tx=0;ty=0}apply()},{passive:false});
wrap.addEventListener('mousedown',e=>{drag=[e.clientX-tx,e.clientY-ty];wrap.style.cursor='grabbing'});
addEventListener('mouseup',()=>{drag=null;wrap.style.cursor='grab'});
addEventListener('mousemove',e=>{if(drag&&z>1){tx=e.clientX-drag[0];ty=e.clientY-drag[1];apply()}});
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.key=='ArrowRight')show(Math.min(pgs.length-1,cur+1));if(e.key=='ArrowLeft')show(Math.max(0,cur-1));if(e.key=='0')reset()});
document.getElementById('q').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();
 document.querySelectorAll('text.hit').forEach(t=>t.classList.remove('hit'));if(q.length<2)return;let first=-1;
 pgs.forEach((p,i)=>p.querySelectorAll('text').forEach(t=>{if(t.textContent.toLowerCase().includes(q)){t.classList.add('hit');if(first<0)first=i}}));
 if(first>=0&&!pgs[cur].querySelector('text.hit'))show(first)});
document.getElementById('rs').onclick=reset;
const dkb=document.getElementById('dk');function setDk(v){document.body.classList.toggle('dk',v);dkb.classList.toggle('on',v);try{localStorage.setItem('rrmap-dark',v?'1':'0')}catch(e){}}
dkb.onclick=()=>setDk(!document.body.classList.contains('dk'));
{let v=new URLSearchParams(location.search).get('theme');let s=null;try{s=localStorage.getItem('rrmap-dark')}catch(e){}setDk(v?v=='dark':s=='1')}
show(+(location.hash.slice(1)||0));
</script></body></html>
