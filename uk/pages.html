</style><rect class="bg" width="1944" height="1093"/><text class="pt" x="972.0" y="80" style="font-size:46px">RAILROADER: СХЕМА КОЛІЙ</text><text class="note" x="972.0" y="120" text-anchor="middle">Sylva – Bryson – Andrews, гілки Alarka, Walker, Connelly Creek · Railroader 0.6.2 Experimental (buildid 26335745) · оновлення Maintenance of Way</text><text class="stn" x="90" y="170" text-anchor="start">ЛЕГЕНДА</text><path class="main" d="M90,200 L180,200"/><text class="note" x="200" y="207">головна колія</text><path class="trk" d="M90,244 L180,244"/><text class="note" x="200" y="251">бічна, обгінна, паркова колія</text><path class="ind" d="M90,288 L180,288"/><text class="note" x="200" y="295">колія підприємства (вантаж)</text><path class="ich" d="M90,332 L180,332"/><text class="note" x="200" y="339">інтерчейндж (купівля, обмін вагонів)</text><path class="svc" d="M90,376 L180,376"/><text class="note" x="200" y="383">сервіс: ремонт, MoW-склад, депо</text><path class="site" d="M90,420 L180,420"/><text class="note" x="200" y="427">майданчик доставки для етапу</text><path class="new" d="M90,464 L180,464"/><path class="trk" d="M90,464 L180,464"/><text class="note" x="200" y="471">підсвітка: колія нова в 0.6 (етап MoW)</text><path class="plat" d="M90,508 L180,508"/><path class="trk" d="M90,508 L180,508"/><text class="note" x="200" y="515">пасажирська платформа</text><path class="trk" d="M90,560 L180,560"/><rect class="bld" x="115" y="541" width="40" height="9"/><text class="note" x="200" y="559">будівля біля колії (з даних гри)</text><line class="bump" x1="135" y1="587" x2="135" y2="605"/><path class="ind" d="M70,596 L135,596"/><text class="note" x="200" y="603">тупик (упор)</text><g class="spd"><circle cx="135" cy="640" r="15"/><text x="135" y="646">25</text></g><text class="note" x="200" y="647">обмеження швидкості, mph (на кривих і станціях, як у грі)</text><g class="ic w"><circle cx="105" cy="684" r="10"/><text x="105" y="688.5">W</text></g><g class="ic d"><circle cx="135" cy="684" r="10"/><text x="135" y="688.5">D</text></g><g class="ic c"><circle cx="165" cy="684" r="10"/><text x="165" y="688.5">C</text></g><text class="note" x="200" y="691">вода · дизель · вугілля</text><circle class="tt" cx="135" cy="728" r="16"/><text class="note" x="200" y="735">поворотне коло</text><path class="br" d="M95,765 L175,765 M95,779 L175,779 M95,779 L105,765 L115,779 L125,765 L135,779 L145,765 L155,779 L165,765 L175,779 M95,765 L95,779 M175,765 L175,779"/><text class="note" x="200" y="779">міст</text><path class="trk" d="M90,816 L180,816"/><path class="tnm" d="M101,816 L169,816"/><path class="tn" d="M102,807 Q90,816 102,825 M168,807 Q180,816 168,825"/><text class="note" x="200" y="823">тунель</text><text class="grade" x="90" y="870" style="font-size:26px">← 4.6% TOPTON</text><text class="note" x="320" y="867">найбільший ухил перегону (300 м); стрілка показує бік підйому</text><text class="note" x="90" y="914" style="font-size:18px">«R1 – 21 ВАГ.»: назва колії з гри і місткість; «16 ВАГ. – 738′»: колія без назви, вагонів і довжина.</text><text class="note" x="90" y="942" style="font-size:18px">Колії підприємств: зона завантаження (trackSpan) і вагони, що туди ходять (цистерна ~35′, хопер ~33′, критий ~41′, шахти 50′ як у грі),</text><text class="note" x="90" y="970" style="font-size:18px">інакше 45′ (як у Dewclaw v3.0); округлено вниз. Колії без назви й обгінні: корисна довжина між точками розходження біля стрілок.</text><text class="note" x="90" y="998" style="font-size:18px">MP: милі від Sylva Interchange (= MP 45) уздовж головної колії.</text><text class="note" x="90" y="1026" style="font-size:18px">Масштаб не дотримано: колії випрямлено, порядок колій і сторона (північ угорі) як у грі. Захід ліворуч.</text><text class="note" x="90" y="1054" style="font-size:18px">Перевірено: усі 1901 сегмент колій Map.json належать коліям, намальованим на сторінках.</text><text class="note" x="90" y="1082" style="font-size:18px">Сигналів (CTC) і переїздів на схемі поки немає.</text><text class="note" x="90" y="1110" style="font-size:18px">Ідея і стиль: станційна схема Dewclaw (Railroader Map v3.0), дякуємо! Колії тут намальовано заново з даних гри 0.6.2.</text><text class="stn" x="1060" y="170" text-anchor="start">СТОРІНКИ (ЗАХІД → СХІД)</text><a href="#pg1" class="pglink"><text class="stn" x="1060" y="204" text-anchor="start" style="font-size:24px">1</text><text class="note" x="1100" y="200" style="font-size:19px;font-weight:700">RED MARBLE GRADE</text></a><text class="note" x="1100" y="224" style="font-size:16px">Andrews (інтерчейндж, трикутник, Engine Service, Snowbird </text><text class="note" x="1100" y="244" style="font-size:16px">Paper, Tatham) · Rhodo · Topton </text><a href="#pg2" class="pglink"><text class="stn" x="1060" y="282" text-anchor="start" style="font-size:24px">2</text><text class="note" x="1100" y="278" style="font-size:19px;font-weight:700">NANTAHALA</text></a><text class="note" x="1100" y="302" style="font-size:16px">Graham County RR (pulpwood) · Nantahala · Union Lumber · </text><text class="note" x="1100" y="322" style="font-size:16px">Nantahala Power &amp; Light </text><a href="#pg3" class="pglink"><text class="stn" x="1060" y="360" text-anchor="start" style="font-size:24px">3</text><text class="note" x="1100" y="356" style="font-size:19px;font-weight:700">LAKE FONTANA</text></a><text class="note" x="1100" y="380" style="font-size:16px">McClain (інтерчейндж, трикутник, Engine Service) · Almond · </text><text class="note" x="1100" y="400" style="font-size:16px">Wesser · Hewitt (Nantahala Talc &amp; Limestone) </text><a href="#pg4" class="pglink"><text class="stn" x="1060" y="438" text-anchor="start" style="font-size:24px">4</text><text class="note" x="1100" y="434" style="font-size:19px;font-weight:700">ALARKA JCT</text></a><text class="note" x="1100" y="458" style="font-size:16px">Brooks · Alarka Jct (трикутник, Alarka Jct Site) · Robinson </text><text class="note" x="1100" y="478" style="font-size:16px">Gap Coal </text><a href="#pg5" class="pglink"><text class="stn" x="1060" y="516" text-anchor="start" style="font-size:24px">5</text><text class="note" x="1100" y="512" style="font-size:19px;font-weight:700">BRYSON</text></a><text class="note" x="1100" y="536" style="font-size:16px">Bryson (парк, депо, Engine Service, MoW, трикутник, </text><text class="note" x="1100" y="556" style="font-size:16px">Appalachian Hardwoods) · Hemingway · Governor’s Island </text><a href="#pg6" class="pglink"><text class="stn" x="1060" y="594" text-anchor="start" style="font-size:24px">6</text><text class="note" x="1100" y="590" style="font-size:19px;font-weight:700">TUCKASEGEE VALLEY (W)</text></a><text class="note" x="1100" y="614" style="font-size:16px">Ela · Whittier (трикутник на Connelly) · East Whittier </text><text class="note" x="1100" y="634" style="font-size:16px">(інтерчейндж, MoW, Engine Service, Saw Mill) · Thomas Valley · </text><text class="note" x="1100" y="654" style="font-size:16px">Wilmot · Barkers </text><a href="#pg7" class="pglink"><text class="stn" x="1060" y="692" text-anchor="start" style="font-size:24px">7</text><text class="note" x="1100" y="688" style="font-size:19px;font-weight:700">TUCKASEGEE VALLEY (E)</text></a><text class="note" x="1100" y="712" style="font-size:16px">Sylva (інтерчейндж, Paperboard &amp; Tannery, трикутник, Building </text><text class="note" x="1100" y="732" style="font-size:16px">Supply, Scott Tie Plant) · Dillsboro (парк, Engine Service, </text><text class="note" x="1100" y="752" style="font-size:16px">Rock Products) · Cowee </text><a href="#pg8" class="pglink"><text class="stn" x="1060" y="790" text-anchor="start" style="font-size:24px">8</text><text class="note" x="1100" y="786" style="font-size:19px;font-weight:700">BRANCHES</text></a><text class="note" x="1100" y="810" style="font-size:16px">Гілки: Alarka (Cochran, Alarka, Alarka Copper M1/M2) · Walker </text><text class="note" x="1100" y="830" style="font-size:16px">· Connelly Creek </text><text class="foot" x="30" y="1059">Railroader 0.6.2 Experimental (buildid 26335745) · згенеровано з даних гри · стиль за схемою Dewclaw (Railroader Map v3.0) · ліцензія схеми: CC BY-NC 4.0 · rostykk.github.io/railroader-map</text></svg></div><div class="pg"><svg id="pg1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1944 1093" width="1944" height="1093"><style>

const pgs=[...document.querySelectorAll('.pg')],btn=[...document.querySelectorAll('nav button')],wrap=document.getElementById('wrap');
let cur=0,z=1,tx=0,ty=0,drag=null;
function svg(){return pgs[cur].querySelector('svg')}
function apply(){svg().style.transform=`translate(${tx}px,${ty}px) scale(${z})`}
function reset(){z=1;tx=0;ty=0;pgs.forEach(p=>p.querySelector('svg').style.transform='')}
function show(i){cur=i;pgs.forEach((p,k)=>p.style.display=k==i?'block':'none');btn.forEach((b,k)=>b.classList.toggle('on',k==i));reset();history.replaceState(null,'','#'+i)}
btn.forEach((b,k)=>b.onclick=()=>show(k));
wrap.addEventListener('wheel',e=>{e.preventDefault();const r=wrap.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
 const nz=Math.min(10,Math.max(1,z*(e.deltaY<0?1.25:0.8)));tx=mx-(mx-tx)*nz/z;ty=my-(my-ty)*nz/z;z=nz;if(z==1){tx=0;ty=0}apply()},{passive:false});
wrap.addEventListener('mousedown',e=>{drag=[e.clientX-tx,e.clientY-ty];wrap.style.cursor='grabbing'});
addEventListener('mouseup',()=>{drag=null;wrap.style.cursor='grab'});
addEventListener('mousemove',e=>{if(drag&&z>1){tx=e.clientX-drag[0];ty=e.clientY-drag[1];apply()}});
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.key=='ArrowRight')show(Math.min(pgs.length-1,cur+1));if(e.key=='ArrowLeft')show(Math.max(0,cur-1));if(e.key=='0')reset()});
document.getElementById('q').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();
 document.querySelectorAll('text.hit').forEach(t=>t.classList.remove('hit'));if(q.length<2)return;let first=-1;
 pgs.forEach((p,i)=>p.querySelectorAll('text').forEach(t=>{if(t.textContent.toLowerCase().includes(q)){t.classList.add('hit');if(first<0)first=i}}));
 if(first>=0&&!pgs[cur].querySelector('text.hit'))show(first)});
document.getElementById('rs').onclick=reset;
const bdb=document.getElementById('bd');function setBd(v){document.body.classList.toggle('nob',!v);bdb.classList.toggle('on',v);try{localStorage.setItem('rrmap-bld',v?'1':'0')}catch(e){}}
bdb.onclick=()=>setBd(document.body.classList.contains('nob'));
{let s=null;try{s=localStorage.getItem('rrmap-bld')}catch(e){}setBd(s!='0')}
const dkb=document.getElementById('dk');function setDk(v){document.body.classList.toggle('dk',v);dkb.classList.toggle('on',v);try{localStorage.setItem('rrmap-dark',v?'1':'0')}catch(e){}}
dkb.onclick=()=>setDk(!document.body.classList.contains('dk'));
{let v=new URLSearchParams(location.search).get('theme');let s=null;try{s=localStorage.getItem('rrmap-dark')}catch(e){}setDk(v?v=='dark':s=='1')}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a');if(!a)return;const h=a.getAttribute('href')||'';if(h.startsWith('#pg')){e.preventDefault();show(+h.slice(3))}});
show(+(location.hash.slice(1).replace('pg','')||0));
</script></body></html>
